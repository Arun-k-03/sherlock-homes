[package]
name = "sherlock-homes"
version = "1.0.1"
edition = "2021"
rust-version = "1.88"
authors = ["Sherlock Homes"]
description = "Sherlock Homes — Cyber Investigation Engine. Every request leaves a clue."
license = "MIT"
readme = "README.md"

repository = "https://github.com/Arun-k-03/sherlock-homes"
homepage = "https://github.com/Arun-k-03/sherlock-homes"

keywords = ["security", "scanner", "cli", "owasp", "dast"]
categories = ["command-line-utilities", "web-programming"]
default-run = "sherlock"

exclude = [
    "/reports",
    "/tmp-clone",
    "/result.json",
]

[[bin]]
name = "sherlock"
path = "src/main.rs"

[lib]
name = "sherlock_homes"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
crossterm = "0.28"
csv = "1"
directories = "5"
futures = "0.3"
hex = "0.4"
once_cell = "1"
parking_lot = "0.12"
percent-encoding = "2"
printpdf = { version = "=0.11.2", default-features = false }
rand = "0.8"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = { version = "0.8", features = ["display"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
which = "6"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[lints.clippy]
too_many_arguments = "allow"

