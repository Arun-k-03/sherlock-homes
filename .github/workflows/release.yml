name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sherlock-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: sherlock-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sherlock-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sherlock-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sherlock-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/sherlock
          if [ -f "${BIN}.exe" ]; then BIN="${BIN}.exe"; fi
          cp "$BIN" "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256" || shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
