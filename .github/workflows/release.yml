name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sherlock-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sherlock-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sherlock-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/sherlock
          if [ -f "${BIN}.exe" ]; then BIN="${BIN}.exe"; fi
          STAGE="stage-${{ matrix.artifact }}"
          mkdir -p "$STAGE"
          if [[ "$BIN" == *.exe ]]; then
            cp "$BIN" "$STAGE/sherlock.exe"
          else
            cp "$BIN" "$STAGE/sherlock"
            chmod +x "$STAGE/sherlock"
          fi
          cp LICENSE README.md "$STAGE/"
          printf '%s\n' "Place sherlock on PATH. Verify SHA256 of this archive." > "$STAGE/INSTALL.txt"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C "$STAGE" .
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
